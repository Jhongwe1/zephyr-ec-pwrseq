# Application configuration.
#
# Deliberately minimal at W01.  Options are added when the code that needs
# them is added, never "just in case" -- dead Kconfig is indistinguishable
# from configuration that matters, and on an EC every kilobyte is real.

CONFIG_LOG=y

# TODO(W06): revisit the logging mode before the first logic-analyser capture.
#
# Zephyr's default deferred logging hands the message to a background thread,
# so the UART bytes leave the pin some time AFTER the event they describe.
# That is invisible on a terminal and fatal for this project: capture profile B
# puts UART1_TX on logic-analyser channel 7 in order to align the firmware's
# own log against the measured edges on ONE time axis.  If the log lags the
# edge by an unknown amount, the alignment proves nothing.
#
# Immediate mode (CONFIG_LOG_MODE_IMMEDIATE) removes the lag but makes the
# logging call block the sequencer thread, which perturbs the very timing
# being measured.  Neither default is automatically right; the decision needs
# a measurement, and the measurement does not exist yet.  Decide in W06 and
# record the reasoning in docs/timing_budget.md.
